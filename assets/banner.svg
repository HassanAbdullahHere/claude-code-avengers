<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Avengers navy-black -->
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#060B18"/>
      <stop offset="50%"  stop-color="#080D1E"/>
      <stop offset="100%" stop-color="#060B18"/>
    </linearGradient>

    <!-- Avengers gold -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#92610A"/>
      <stop offset="40%"  stop-color="#FFD700"/>
      <stop offset="60%"  stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#92610A"/>
    </linearGradient>
    <linearGradient id="gold-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- Glows -->
    <radialGradient id="center-glow" cx="50%" cy="45%" r="38%">
      <stop offset="0%"   stop-color="#FFD700" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="left-glow"   cx="0%"   cy="50%" r="40%">
      <stop offset="0%"   stop-color="#1D4ED8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="right-glow"  cx="100%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#1D4ED8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>

    <filter id="title-glow" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="a-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pill-glow" x="-15%" y="-30%" width="130%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Hex clip -->
    <clipPath id="clip"><rect width="1280" height="320"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">

    <!-- ── BACKGROUND ── -->
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#center-glow)"/>
    <rect width="1280" height="320" fill="url(#left-glow)"/>
    <rect width="1280" height="320" fill="url(#right-glow)"/>

    <!-- ── HEX GRID TEXTURE (S.H.I.E.L.D. style) ── -->
    <!-- Left cluster -->
    <g stroke="#1E3A8A" stroke-width="0.6" fill="none" opacity="0.35">
      <polygon points="60,60 90,43 120,60 120,94 90,111 60,94"/>
      <polygon points="120,60 150,43 180,60 180,94 150,111 120,94"/>
      <polygon points="90,111 120,94 150,111 150,145 120,162 90,145"/>
      <polygon points="60,162 90,145 120,162 120,196 90,213 60,196"/>
      <polygon points="120,162 150,145 180,162 180,196 150,213 120,196"/>
      <polygon points="30,162 60,145 90,162 90,196 60,213 30,196"/>
      <polygon points="60,213 90,196 120,213 120,247 90,264 60,247"/>
      <polygon points="120,9 150,-8 180,9 180,43 150,60 120,43"/>
      <polygon points="180,9 210,-8 240,9 240,43 210,60 180,43"/>
    </g>
    <!-- Right cluster -->
    <g stroke="#1E3A8A" stroke-width="0.6" fill="none" opacity="0.35">
      <polygon points="1160,60 1190,43 1220,60 1220,94 1190,111 1160,94"/>
      <polygon points="1100,60 1130,43 1160,60 1160,94 1130,111 1100,94"/>
      <polygon points="1130,111 1160,94 1190,111 1190,145 1160,162 1130,145"/>
      <polygon points="1160,162 1190,145 1220,162 1220,196 1190,213 1160,196"/>
      <polygon points="1100,162 1130,145 1160,162 1160,196 1130,213 1100,196"/>
      <polygon points="1220,162 1250,145 1280,162 1280,196 1250,213 1220,196"/>
      <polygon points="1160,213 1190,196 1220,213 1220,247 1190,264 1160,247"/>
      <polygon points="1100,9 1130,-8 1160,9 1160,43 1130,60 1100,43"/>
      <polygon points="1040,9 1070,-8 1100,9 1100,43 1070,60 1040,43"/>
    </g>

    <!-- ── AVENGERS "A" WATERMARK ── -->
    <!-- Outer A shape: two legs + crossbar, bold stroke, gold, very low opacity -->
    <g filter="url(#a-glow)" opacity="0.10">
      <!-- Left leg -->
      <line x1="640" y1="30" x2="490" y2="290" stroke="#FFD700" stroke-width="28" stroke-linecap="square"/>
      <!-- Right leg -->
      <line x1="640" y1="30" x2="790" y2="290" stroke="#FFD700" stroke-width="28" stroke-linecap="square"/>
      <!-- Crossbar -->
      <line x1="568" y1="180" x2="712" y2="180" stroke="#FFD700" stroke-width="18" stroke-linecap="square"/>
    </g>
    <!-- Slightly brighter outline on top -->
    <g opacity="0.06">
      <line x1="640" y1="30" x2="490" y2="290" stroke="#FFD700" stroke-width="2"/>
      <line x1="640" y1="30" x2="790" y2="290" stroke="#FFD700" stroke-width="2"/>
      <line x1="568" y1="180" x2="712" y2="180" stroke="#FFD700" stroke-width="2"/>
    </g>

    <!-- ── HORIZONTAL RULE LINES ── -->
    <!-- Top frame -->
    <line x1="0"   y1="42" x2="350" y2="42" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="930"  y1="42" x2="1280" y2="42" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="1"/>
    <!-- Corner ticks -->
    <line x1="0"   y1="42" x2="0"   y2="60" stroke="#FFD700" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="1280" y1="42" x2="1280" y2="60" stroke="#FFD700" stroke-opacity="0.5" stroke-width="2"/>
    <!-- Bottom frame -->
    <line x1="0"   y1="278" x2="350" y2="278" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="930"  y1="278" x2="1280" y2="278" stroke="url(#gold)" stroke-opacity="0.5" stroke-width="1"/>
    <line x1="0"   y1="278" x2="0"   y2="260" stroke="#FFD700" stroke-opacity="0.5" stroke-width="2"/>
    <line x1="1280" y1="278" x2="1280" y2="260" stroke="#FFD700" stroke-opacity="0.5" stroke-width="2"/>

    <!-- ── TITLE ── -->
    <text
      x="640" y="126"
      text-anchor="middle"
      font-family="'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif"
      font-weight="800"
      font-size="58"
      letter-spacing="-0.5"
      fill="white"
      filter="url(#title-glow)"
    >claude-code-avengers</text>

    <!-- Gold accent bar under title -->
    <rect x="380" y="142" width="520" height="2.5" rx="1.5" fill="url(#gold)"/>

    <!-- ── SUBTITLE ── -->
    <text
      x="640" y="182"
      text-anchor="middle"
      font-family="'Segoe UI', system-ui, sans-serif"
      font-size="18"
      fill="#94A3B8"
      letter-spacing="0.5"
    >Five specialist agents. One command. Instant structured verdict.</text>

    <!-- ── AGENT PILLS — Marvel character colors ── -->
    <!-- Centers: 252 | 394 | 640 | 886 | 1028  (gap=12, width=260 for stark, 120 others) -->

    <!-- all pills: y=224 height=36 text-y=247 — uniform alignment -->

    <!-- 🛡️ shield — S.H.I.E.L.D. blue -->
    <rect x="283" y="224" width="130" height="36" rx="18"
      fill="#1E3A8A" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.2"/>
    <text x="348" y="247" text-anchor="middle"
      font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#93C5FD">🛡️  shield</text>

    <!-- 🦅 hawk — Hawkeye purple -->
    <rect x="429" y="224" width="130" height="36" rx="18"
      fill="#4C1D95" fill-opacity="0.4" stroke="#8B5CF6" stroke-width="1.2"/>
    <text x="494" y="247" text-anchor="middle"
      font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#C4B5FD">🦅  hawk</text>

    <!-- ⚡ stark — Iron Man gold (center, same size, gold border) -->
    <rect x="575" y="224" width="130" height="36" rx="18"
      fill="#78350F" fill-opacity="0.5" stroke="#FFD700" stroke-width="1.8"
      filter="url(#pill-glow)"/>
    <text x="640" y="247" text-anchor="middle"
      font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FDE68A">⚡  stark</text>

    <!-- 🕷️ parker — Spider-Man red -->
    <rect x="721" y="224" width="130" height="36" rx="18"
      fill="#7F1D1D" fill-opacity="0.4" stroke="#EF4444" stroke-width="1.2"/>
    <text x="786" y="247" text-anchor="middle"
      font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#FCA5A5">🕷️  parker</text>

    <!-- 🏴 banner — Hulk green -->
    <rect x="867" y="224" width="130" height="36" rx="18"
      fill="#14532D" fill-opacity="0.4" stroke="#22C55E" stroke-width="1.2"/>
    <text x="932" y="247" text-anchor="middle"
      font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#86EFAC">🏴  banner</text>

    <!-- ── BOTTOM TAGLINE ── -->
    <text
      x="640" y="298"
      text-anchor="middle"
      font-family="'Segoe UI', system-ui, sans-serif"
      font-size="11"
      fill="#334155"
      letter-spacing="3"
    >BUILT FOR CLAUDE CODE</text>

  </g>
</svg>
